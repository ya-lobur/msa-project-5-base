apiVersion: v1
kind: Secret
metadata:
  name: etl-secrets
  namespace: shipments-etl
  labels:
    app: shipments-etl
type: Opaque
data:
  # Database credentials (base64 encoded)
  # In production, use external secret management (e.g., Sealed Secrets, Vault)
  #
  # Default values (for testing only):
  # DB_USER: postgres (base64: cG9zdGdyZXM=)
  # DB_PASSWORD: postgres (base64: cG9zdGdyZXM=)
  DB_USER: cG9zdGdyZXM=
  DB_PASSWORD: cG9zdGdyZXM=
