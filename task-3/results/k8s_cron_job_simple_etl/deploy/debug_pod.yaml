apiVersion: v1
kind: Pod
metadata:
  name: debug-etl-data
  namespace: shipments-etl
spec:
  restartPolicy: Never
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data-volume
          mountPath: /data
  volumes:
    - name: data-volume
      persistentVolumeClaim:
        claimName: etl-data-pvc