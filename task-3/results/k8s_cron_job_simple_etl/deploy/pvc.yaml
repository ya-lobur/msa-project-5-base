apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etl-data-pvc
  namespace: shipments-etl
  labels:
    app: shipments-etl
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  # For Minikube, use default storage class
  # storageClassName: standard
